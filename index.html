<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="아주대학교 식당의 주간 메뉴를 한국어와 중국어로 확인하세요. 查看亚洲大学食堂每周菜单，支持中韩双语。">
  <title>아주대학교 식단 · Ajou Menu</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ajou Menu">
  <meta name="format-detection" content="telephone=no">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ajou Menu · 亚洲大学食堂菜单">
  <meta property="og:description" content="宿舍食堂与教职工食堂，中韩双语菜单、供餐时段和每周预告。">
  <meta property="og:url" content="https://zhupoxixixi-lang.github.io/ajou-menu/">
  <meta property="og:image" content="https://zhupoxixixi-lang.github.io/ajou-menu/share.png?v=20261127-new-repo">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://zhupoxixixi-lang.github.io/ajou-menu/">
  <script>try{var l=new URLSearchParams(location.search).get('lang')||localStorage.getItem('menuLang');if(l==='cn')document.documentElement.lang='zh-CN';}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261128-cleanup">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261128-cleanup">
  <link rel="manifest" href="manifest.webmanifest?v=20261128-cleanup">
  <link rel="stylesheet" href="styles.css?v=20261128-cleanup">
  <script defer src="menu-data.js?v=20261128-cleanup"></script>
  <script defer src="menu.js?v=20261128-cleanup"></script>
</head>
<body>
  <a class="skip-link" href="#menuList" id="skipLink">메뉴로 바로가기</a>

  <header class="top-bar" id="topBar">
    <div class="shell top-bar-inner">
      <span class="top-bar-title" id="compactTitle" aria-hidden="true"></span>
      <div class="top-actions">
        <button class="pill-button" id="nowButton" type="button" hidden><span data-icon="clock"></span><span id="nowLabel">지금</span></button>
        <button class="pill-button lang-button" id="langToggle" type="button"><span id="languageLabel">中文</span></button>
        <button class="circle-button" id="toolsToggle" type="button" aria-haspopup="dialog"><span data-icon="more"></span></button>
      </div>
    </div>
  </header>

  <main class="shell page">
    <section class="hero" aria-labelledby="pageTitle">
      <p class="eyebrow" id="brandSubtitle">아주대학교 식단</p>
      <h1 id="pageTitle">오늘</h1>
      <p class="hero-date" id="heroDate"></p>
    </section>

    <nav class="week-strip" id="weekStrip" aria-label="날짜 선택"></nav>

    <div class="controls">
      <div class="segmented" id="restaurantTabs" role="tablist" aria-label="식당 선택"></div>
      <div class="segmented" id="mealTabs" role="tablist" aria-label="식사 선택"></div>
    </div>

    <div id="dataStatus" class="banner" role="status" hidden></div>

    <section class="meal-panel" id="mealPanel" aria-labelledby="mealHeading">
      <div class="meal-head">
        <div class="meal-head-copy">
          <h2 id="mealHeading" class="sr-only"></h2>
          <p class="service-line"><span class="status-chip" id="serviceState" data-state=""></span><span class="service-hours" id="serviceHours"></span></p>
          <p class="service-place" id="servicePlace"></p>
        </div>
        <button class="circle-button tinted" id="shareButton" type="button"><span data-icon="copy"></span></button>
      </div>
      <div id="restaurantStatus" class="banner" role="status" hidden></div>
      <div id="menuList" class="menu-list" tabindex="-1"></div>
      <div id="emptyState" class="empty-card" hidden>
        <span data-icon="bowl" class="empty-symbol"></span>
        <h3 id="emptyTitle"></h3>
        <p id="emptyDescription"></p>
      </div>
    </section>

    <footer class="page-footer">
      <p id="updatedAt"></p>
      <p id="footerNotice"></p>
    </footer>
  </main>

  <dialog id="toolsDialog" class="sheet" aria-labelledby="toolsTitle">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="toolsTitle">설정</h2><button class="text-button" type="button" data-close="toolsDialog" id="toolsDone">완료</button></div>
    <div class="sheet-body">
      <div class="group">
        <button class="group-row" id="refreshButton" type="button"><span class="row-icon blue"><span data-icon="refresh"></span></span><span class="row-label" id="refreshLabel">메뉴 새로고침</span></button>
        <a class="group-row" id="sourceLink" href="https://www.ajou.ac.kr/kr/life/food.do" target="_blank" rel="noopener noreferrer"><span class="row-icon green"><span data-icon="external"></span></span><span class="row-label" id="sourceLabel">학교 원문</span><span class="row-chevron" data-icon="right"></span></a>
        <a class="group-row" href="https://github.com/zhupoxixixi-lang/ajou-menu" target="_blank" rel="noopener noreferrer"><span class="row-icon gray"><span data-icon="github"></span></span><span class="row-label">GitHub</span><span class="row-chevron" data-icon="right"></span></a>
      </div>
      <p id="refreshStatus" class="group-footer" role="status" aria-live="polite" hidden></p>
      <section id="operatingSection" hidden>
        <h3 class="group-header" id="operatingTitle"></h3>
        <div class="group text-group" id="operatingDetails"></div>
      </section>
      <p class="group-footer" id="disclaimer"></p>
    </div>
  </dialog>

  <dialog id="copyDialog" class="sheet" aria-labelledby="copyTitle">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="copyTitle"></h2><button class="text-button" type="button" data-close="copyDialog" id="copyDone">완료</button></div>
    <div class="sheet-body"><p class="group-footer" id="copyHint"></p><textarea id="copyText" readonly aria-labelledby="copyTitle"></textarea></div>
  </dialog>

  <div id="actionStatus" class="toast" role="status" hidden></div>
  <noscript><p class="noscript-note">JavaScript를 켜면 메뉴를 확인할 수 있습니다. 请启用 JavaScript 查看菜单。</p></noscript>
</body>
</html>
