name: Daily Menu Scrape

on:
  schedule:
    - cron: '0 15 * * *'  # 00:00 KST the next day; scheduled execution can be delayed
    - cron: '0 21 * * *'  # 06:00 KST retry in case the midnight source fetch failed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-menu-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      TRANSLATE_MODEL: 'deepseek-flash'
      TRANSLATE_REASONING_EFFORT: 'high'
      TRANSLATE_API_ENDPOINT: ${{ vars.TRANSLATE_API_ENDPOINT || 'https://api.deepseek.com' }}
      TRANSLATE_MAX_WORKERS: '4'
      TRANSLATE_RUN_TIMEOUT_SECONDS: '600'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check menu regressions
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs
      - name: Restore translation cache
        uses: actions/cache/restore@v4
        with:
          path: data/translation_cache.json
          key: menu-translations-v4-review-${{ runner.os }}-${{ env.TRANSLATE_MODEL }}-${{ env.TRANSLATE_REASONING_EFFORT }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            menu-translations-v4-review-${{ runner.os }}-${{ env.TRANSLATE_MODEL }}-${{ env.TRANSLATE_REASONING_EFFORT }}-
      - name: Run scraper
        env:
          MENU_FETCH_TRANSPORT: 'reader_first'
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          MENU_RETRY_RUN: ${{ github.event.schedule == '0 21 * * *' && '1' || '' }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          REQUIRE_TRANSLATION: '1'
        run: python -m scraper.main
      - name: Save translation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/translation_cache.json
          key: menu-translations-v4-review-${{ runner.os }}-${{ env.TRANSLATE_MODEL }}-${{ env.TRANSLATE_REASONING_EFFORT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu-data.js
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly menu for $(TZ=Asia/Seoul date +%Y-%m-%d)"
            # Another push may land while the job runs; replay this data commit on top.
            for attempt in 1 2 3; do
              git push && exit 0
              sleep $((attempt * 5))
              git pull --rebase origin main
            done
            exit 1
          fi
